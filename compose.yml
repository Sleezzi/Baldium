# To understand how to properly fill out this file: https://wiki.sleezzi.fr/en/baldium/compose_yml

services:
  baldium_server:
    image: "itzg/minecraft-server:stable-java25-jdk"
    container_name: "baldium-server"
    tty: true
    mem_limit: 5.5G
    cpus: 3.5
    stdin_open: true
    ports:
      - "25565:25565"
    user: "1000:1000"
    cap_drop:
      - ALL
    cap_add:
      - "CHOWN"
      - "FOWNER"
      - "SETUID"
      - "SETGID"
    environment:
      TYPE: "FABRIC"
      DIFFICULTY: "3"
      ENABLE_COMMAND_BLOCK: "true"
      ENABLE_RCON: "true"
      ENABLE_ROLLING_LOGS: "true"
      EULA: "TRUE"
      FORCE_GAMEMODE: "true"
      JVM_OPTS: "-Xmx5G -Xms512M"
      LOG_TIMESTAMP: "true"
      MEMORY: ""
      MOTD: ""
      ONLINE_MODE: "false"
      RCON_CMDS_LAST_DISCONNECT: |-
        save-all flush
      RCON_PASSWORD: "${RCON_PASSWORD}"
      RCON_PORT: 25575
      TZ: "Europe/Paris"
      VERSION: "1.21.11"
    volumes:
      - "minecraft:/data/"
    restart: "unless-stopped"
  baldium_db:
    image: "mysql:latest"
    container_name: "baldium-db"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "Baldium"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - "database:/var/lib/mysql"
      - "${PWD}/src/database_setup.sql:/docker-entrypoint-initdb.d/init.sql"
    deploy:
      resources:
        limits:
          memory: 1G
    ports:
      - "30042:3306"
    restart: "unless-stopped"
  baldium_proxy:
    build:
      context: .
      dockerfile: "Socket.Dockerfile"
    image: "baldium/socket-proxy:latest"
    container_name: "baldium-proxy"
    userns_mode: "host"
    user: "0:0"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    cap_drop:
      - ALL
    environment:
      MINECRAFT_CONTAINER: "baldium-server"
      API_CONTAINER: "baldium-api"
      PORT: 85
    command: "node /Docker/dist/index.js"
    deploy:
      resources:
        limits:
          memory: 500M
    restart: "unless-stopped"
  baldium_logs_init:
    image: "alpine:latest"
    container_name: "baldium-logs-init"
    user: "0:0"
    volumes:
      - "logs:/logs"
    command: "sh -c 'mkdir -p /logs && chown -R 1000:1000 /logs'"
    restart: "no"
  baldium_api:
    build:
      context: .
      dockerfile: "API.Dockerfile"
    image: "baldium/api:latest"
    container_name: "baldium-api"
    user: "1000:1000"
    volumes:
      - "minecraft:/minecraft"
      - "logs:/logs"
    depends_on:
      baldium_server:
        condition: service_started
      baldium_db:
        condition: service_started
      baldium_proxy:
        condition: service_started
      baldium_logs_init:
        condition: service_completed_successfully
    ports:
      - "30040:80"
      - "30041:81"
    cap_drop:
      - ALL
    cap_add:
      - MKNOD
    environment:
      SECRET_KEY: "${SECRET_KEY}"                                           # This key is used during token generation and data encryption. It must absolutely remain secret.
      MINECRAFT_IP: "baldium_server"                                        # The name of the container used for the Minecraft server. It allows connection to the server's RCON.
      MINECRAFT_PORT: 25575                                                 # The port used for RCON by the Minecraft server.
      MINECRAFT_PASSWORD: "${MINECRAFT_PASSWORD}"                           # The login password for the RCON
      MINECRAFT_NAME: "Lucwars's SMP"                                       # The version used by the Minecraft server
      VERSION: "1.21.11"                                                    # The version used by the Minecraft server
      MODLOADER: "fabric"                                                   # The modloader used by the Minecraft server
      SERVER_PATH: "/minecraft"                                             # The path used by the server
      LOGS_PATH: "/logs"                                                    # The path used for logs
      LOGS_LIFETIME: 30                                                     # Log retention time in days.
      TRUSTED_PROXY: 1                                                      # The number of allowed proxies
      ALLOWED_ORIGIN: "http://localhost:5173 https://dash.play.sleezzi.fr"  # The horns that are allowed. This does not apply to WebSocket
      DATABASE_USER: "${MYSQL_USER}"                                        # The server's database user
      DATABASE_HOST: "baldium_db"                                           # The server's database host
      DATABASE_NAME: "Baldium"                                              # The server's database name
      DATABASE_PASSWORD: "${DATABASE_PASSWORD}"                             # The server's database password
      DATABASE_PORT: 3306                                                   # The server's database port
      MAIL: "donotreply@sleezzi.fr"                                         # The email address that the server should use to send emails
      MAIL_NAME: "Baldium"                                                  # The name the server should use to send emails. It will be used in the message subject line in the format "NAME - Subject".
      MAIL_PASSWORD: "${MAIL_PASSWORD}"                                     # The password that the server must use to send emails
      MAIL_HOST: "ssl0.ovh.net"                                             # The URL that the server should use to send emails
      MAIL_PORT: 465                                                        # The port that the server should use to send emails
      SOCKET_DOCKER_PROXY: "ws://baldium_proxy:85"                          # The address for the Docker proxy
      DISCORD_CLIENT_ID: "${CLIENT_ID}"                                     # The client ID from the Discord application. It is used for authenticating the user via Discord.
      DISCORD_CLIENT_SECRET: "${CLIENT_SECRET}"                             # The secret client from the Discord application. It is used for user authentication by Discord.
    command: "node /Docker/dist/index.js"
    deploy:
      resources:
        limits:
          memory: 500M
    restart: "unless-stopped"
volumes:
  database:
  minecraft:
  logs: