# To understand how to properly fill out this file: https://wiki.sleezzi.fr/en/baldium/compose_yml

services:
  minecraft:
    image: "itzg/minecraft-server:stable-java25-jdk"
    container_name: "baldium-server"
    tty: true
    mem_limit: 5.5G
    cpus: 3.5
    stdin_open: true
    ports:
      - "25565:25565"
    user: "1000:1000"
    networks:
      - minecraft_network
    cap_drop:
      - ALL
    cap_add:
      - "CHOWN"
      - "FOWNER"
      - "SETUID"
      - "SETGID"
    env_file:
      - ./Minecraft.env
    environment:
      ENABLE_RCON: "true"
      ENABLE_ROLLING_LOGS: "true"
      EULA: "TRUE"
      JVM_OPTS: "-Xmx5G -Xms512M"     # Must be the same value as "mem_limit" but 0.5 lower.
      LOG_TIMESTAMP: "true"
      MEMORY: ""                      # Must be empty because it's set with JVM_OPTS and mem_limit
      RCON_CMDS_LAST_DISCONNECT: |-
        save-all flush
    volumes:
      - "minecraft:/data/"
    restart: "unless-stopped"
  db:
    image: "mysql:latest"
    container_name: "baldium-db"
    networks:
      - database_network
    env_file:
      - database/DB.env
    volumes:
      - "database:/var/lib/mysql"
      - "${PWD}/database:/docker-entrypoint-initdb.d/"
    deploy:
      resources:
        limits:
          memory: 1G
    restart: "unless-stopped"
  socket_proxy:
    build:
      context: .
      dockerfile: "node.Dockerfile"
      args:
        SERVICE_NAME: "socket-proxy"
    image: "baldium/socket-proxy:latest"
    container_name: "baldium-socket-proxy"
    userns_mode: "host"
    user: "0:0"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    cap_drop:
      - ALL
    networks:
      - proxy_network
    environment:
      MINECRAFT_CONTAINER: "baldium-server"
      API_CONTAINER: "baldium-api"
      PORT: 85
    deploy:
      resources:
        limits:
          memory: 500M
    restart: "unless-stopped"
  backup:
    build:
      context: .
      dockerfile: "node.Dockerfile"
      args:
        SERVICE_NAME: backup
    container_name: "baldium-backup"
    networks:
      - database_network
      - backup_network
    volumes:
      - "minecraft:/minecraft:ro"
    depends_on:
      minecraft:
        condition: service_started
      db:
        condition: service_started
    env_file:
      - ./services/backup/.env
    environment:
      WORLD_PATH: "/minecraft"
      # DATABASE_USER: "backup"
      # DATABASE_PASSWORD: "password1234"
      # DATABASE_NAME: "baldium"
      # R2_ENDPOINT: "https://id.r2.cloudflarestorage.com"
      # R2_ACCESS_KEY_ID: "access_key"
      # R2_SECRET_ACCESS_KEY: "secret_acess_key"
      # R2_BUCKET_NAME: "baldium"
      DATABASE_HOST: "db"
      HTTP_PORT: 3080
      # WEBHOOK: "https://discord.com/api/webhooks/1234567890/cool.webhook"
    deploy:
      resources:
        limits:
          memory: 500M
    restart: "unless-stopped"
  logs_init:
    image: "alpine:latest"
    container_name: "baldium-logs-init"
    user: "0:0"
    volumes:
      - "logs:/logs"
    command: "sh -c 'mkdir -p /logs && chown -R 1000:1000 /logs'"
    restart: "no"
  api:
    build:
      context: .
      dockerfile: "node.Dockerfile"
      args:
        SERVICE_NAME: api
    image: "baldium/api:latest"
    container_name: "baldium-api"
    user: "1000:1000"
    networks:
      - minecraft_network
      - database_network
      - api_network
      - proxy_network
      - backup_network
    volumes:
      - "minecraft:/minecraft"
      - "logs:/logs"
    depends_on:
      minecraft:
        condition: service_started
      db:
        condition: service_started
      socket_proxy:
        condition: service_started
      logs_init:
        condition: service_completed_successfully
    ports:
      - "30040:80"
      - "30041:81"
    cap_drop:
      - ALL
    cap_add:
      - MKNOD
    env_file:
      - ./services/api/.env
    environment:
      # SECRET_KEY: "SUPER_SECRET_KEY"                                                                     # This key is used during token generation and data encryption. It must absolutely remain secret.
      # LOW_SECRET_KEY: "SUPER_SECRET_KEY_BUT_DIFFERENT_FROM_SECRET_KEY"                                   # This key is used for encrypting email addresses. It must be different from SECRET_KEY.
      MINECRAFT_IP: "minecraft"                                                                       # The name of the container used for the Minecraft server. It allows connection to the server's RCON.
      MINECRAFT_PORT: 25575                                                                                # The port used for RCON by the Minecraft server.
      # MINECRAFT_PASSWORD: "password1234"                                                                 # The login password for the RCON
      # MINECRAFT_NAME: "Exemple"                                                                          # The version used by the Minecraft server
      # MINECRAFT_DOMAIN: "exemple.com"                                                                    # The Minecraft server's domain name. This is not the domain name players will use to connect to the game.
      # VERSION: "1.8.9"                                                                                   # The version used by the Minecraft server
      # MODLOADER: "vanilla"                                                                               # The modloader used by the Minecraft server
      SERVER_PATH: "/minecraft"                                                                            # The path used by the server
      LOGS_PATH: "/logs"                                                                                   # The path used for logs
      LOGS_LIFETIME: 30                                                                                    # Log retention time in days.
      # TRUSTED_PROXY: 1                                                                                   # The number of allowed proxies
      # ALLOWED_ORIGIN: "http://localhost:8080 https://dash.exemple.com"                                   # The horns that are allowed. This does not apply to WebSocket
      # DATABASE_USER: "api"                                                                               # The server's database user
      DATABASE_HOST: "db"                                                                          # The server's database host
      DATABASE_NAME: "baldium"                                                                             # The server's database name
      # DATABASE_PASSWORD: "password1234"                                                                  # The server's database password
      DATABASE_PORT: 3306                                                                                  # The server's database port
      # MAIL: "email@exemple.com"                                                                          # The email address that the server should use to send emails
      # MAIL_NAME: "Exemple"                                                                               # The name the server should use to send emails. It will be used in the message subject line in the format "NAME - Subject".
      # MAIL_PASSWORD: "password1234"                                                                      # The password that the server must use to send emails
      # MAIL_HOST: "mail.exemple.com"                                                                      # The URL that the server should use to send emails
      # MAIL_PORT: 465                                                                                     # The port that the server should use to send emails
      SOCKET_DOCKER_PROXY: "ws://socket_proxy:85"                                                  # The address for the Docker proxy
      BACKUP: "backup:3080"                                                                        # The client ID from the Discord application. It is used for authenticating the user via Discord.
      # DISCORD_CLIENT_ID: "01234567890123456"                                                             # The client ID from the Discord application. It is used for authenticating the user via Discord.
      # DISCORD_CLIENT_SECRET: "Secret_Generated_By_Discord"                                               # The secret client from the Discord application. It is used for user authentication by Discord.
      # DEBUG: TRUE                                                                                        # Must be TRUE or FALSE
    deploy:
      resources:
        limits:
          memory: 500M
    restart: "unless-stopped"

networks:
  minecraft_network:
  database_network:
    internal: true
  backup_network:
  proxy_network:
    internal: true
  api_network:

volumes:
  database:
  minecraft:
  logs: